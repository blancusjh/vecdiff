[pytest]
testpaths = general/tests stigmatic/tests validation
addopts = --import-mode=importlib
# Opt-in rows. The slow regression rows (general/tests/test_eikonal_regression.py,
# R = 1000 lambda0) run only with VECDIFF_SLOW=1; "-m slow" selects them.
# GPU rows run only where CuPy finds a CUDA device; "-m gpu" selects them, and
# VECDIFF_BACKEND=CUDA runs the whole general suite on the GPU.
markers =
    slow: opt-in regression rows at R = 1000 wavelengths; run with VECDIFF_SLOW=1
    gpu: needs CuPy and a CUDA device
