name: Scientific validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test,examples,nufft,validation]' build
      - run: python -m pytest -q
      - run: python -m build
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[notebooks,nufft,validation]' -c requirements-validation.txt
      - name: Check committed executed outputs
        id: committed_outputs
        continue-on-error: true
        run: python scripts/notebooks.py --check
      - run: python scripts/notebooks.py --check --execute
      - run: python scripts/notebooks.py --check
      - name: Require fresh committed outputs
        if: steps.committed_outputs.outcome == 'failure'
        run: |
          echo 'Commit the freshly executed notebooks from the artifact; source-only or stale outputs cannot pass this gate.'
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: executed-scientific-notebooks
          path: build/notebooks/
