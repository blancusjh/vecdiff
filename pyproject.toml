[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecdiff"
version = "0.2.0"
description = "General vectorial diffraction: spectral interface operators for arbitrary curved surfaces, with an exact stigmatic Hankel chain as the rigorous anchor"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
# The general surface transform (freeform surfaces, operator composition on
# large apertures) is near-linear only with finufft; without it the wave
# subpackage falls back to direct sums on the axisymmetric polar path.
wave = ["finufft>=2.2"]
raytracer = ["geometrical-raytracer"]

[dependency-groups]
dev = [
  "pytest",
  "jupytext",
  "ipykernel",
  "nbformat",
  "nbconvert>=7.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vecdiff*"]

[tool.setuptools.package-data]
"vecdiff.wave" = ["data/*.json", "data/prescriptions/*"]
