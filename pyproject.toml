[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecdiff"
version = "0.3.0"
description = "Electric-field spectral interface transformations and homogeneous Maxwell propagation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[project.optional-dependencies]
nufft = ["finufft>=2.2"]
validation = ["miepython==3.3.0"]

[dependency-groups]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vecdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
