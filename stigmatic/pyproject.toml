[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecdiff-stigmatic"
version = "0.1.0"
description = "Reference-sphere transfer and vector focusing for stigmatic optics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8"]
nufft = ["finufft>=2.3"]
notebooks = ["matplotlib>=3.8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
